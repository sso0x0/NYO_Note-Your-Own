#      mail:
#        smtp:
#          auth: true
#          starttls:
#            enable: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o

gcp:
  storage:
    bucket: nyo_images

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 3600000 # 1시간

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  oauth2:
    redirect-uri: http://localhost:5173/oauth2/redirect

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-phone: ${SOLAPI_SENDER_PHONE}